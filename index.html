<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sellium Chat</title>
<style>
:root{--c1:#00d4ff;--c2:#00a9d2;--c3:#003356;--bg:#000;--txt:#d8f6ff;--mut:#5f8da0;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--c1);outline-offset:2px}

/* ---------- ARRANQUE ---------- */
#boot{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#000;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;transition:opacity 1.2s ease,visibility 1.2s}
#boot.gone{opacity:0;visibility:hidden;pointer-events:none}
#boot .hint{display:grid;gap:18px;justify-items:center;color:var(--c3);font-size:13px;letter-spacing:.35em;animation:breathe 3.2s ease-in-out infinite;transition:opacity .6s}
#boot .core{width:6px;height:6px;border-radius:50%;background:var(--c3);box-shadow:0 0 14px var(--c3)}
#boot .dots{display:flex;gap:10px}
#boot .dots i{width:5px;height:5px;border-radius:50%;background:var(--c3);transition:.4s var(--ease)}
#boot .dots i.on{background:var(--c1);box-shadow:0 0 12px var(--c1);transform:scale(1.5)}
#boot.waking .hint{opacity:0;animation:none}
@keyframes breathe{50%{opacity:.35}}
#bz{position:absolute;inset:0;display:grid;place-items:center;will-change:transform}
#bz .rings{position:absolute;width:220vmax;height:220vmax;left:50%;top:50%;margin:-110vmax 0 0 -110vmax;pointer-events:none;
background:repeating-radial-gradient(circle at 50% 50%,transparent 0 78px,rgba(0,86,140,.5) 79px 80px);
-webkit-mask:radial-gradient(circle 52vmax at 50% 50%,#000 8%,transparent 100%);mask:radial-gradient(circle 52vmax at 50% 50%,#000 8%,transparent 100%);transition:opacity 1.3s ease .25s}
#boot.waking .rings{opacity:0}
#bload{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:24px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity 1s ease .2s,visibility 0s .2s}
#boot.loading #bload{opacity:1;visibility:visible}
#bload span{font-size:11px;letter-spacing:.5em;color:var(--c2);margin-right:-.5em}
#bload .lc{width:10px;height:10px;border-radius:50%;background:var(--c1);box-shadow:0 0 30px 10px rgba(0,212,255,.55);animation:lc 2s ease-in-out infinite}
@keyframes lc{50%{transform:scale(2.4);box-shadow:0 0 50px 18px rgba(0,212,255,.35)}}
#bload .pb{width:200px;height:2px;background:var(--c3);overflow:hidden}
#bload .pb i{display:block;height:100%;background:var(--c1);box-shadow:0 0 10px var(--c1);transform:scaleX(0);transform-origin:left}
#bload.go .pb i{animation:pb var(--pd,7s) linear forwards}
@keyframes pb{to{transform:scaleX(1)}}
@keyframes uiin{from{opacity:0;transform:translateY(12px)}}
#app:not(.ui) header,#app:not(.ui) #log,#app:not(.ui) form{opacity:0;pointer-events:none}
#app.ui header,#app.ui #log,#app.ui form{animation:uiin 1.2s var(--ease) both}
.rip{position:fixed;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:1px solid var(--c1);box-shadow:0 0 18px var(--c1),inset 0 0 10px var(--c1);pointer-events:none;z-index:11;animation:rip .9s var(--ease) forwards}
@keyframes rip{to{transform:scale(11);opacity:0}}
#flash{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:var(--c1);box-shadow:0 0 60px 30px var(--c1);z-index:12;opacity:0;pointer-events:none}
#flash.go{animation:flash 1.5s ease-out}
@keyframes flash{0%{opacity:0;transform:scale(.2)}25%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(60)}}

/* ---------- APP ---------- */
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 230px 1fr auto;max-width:860px;margin:0 auto;padding:0 18px 18px;opacity:0;filter:blur(10px);transform:scale(.97);transition:opacity .8s var(--ease),filter .8s var(--ease),transform .8s var(--ease)}
#app.on{opacity:1;filter:none;transform:none}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity 2s;
background:radial-gradient(ellipse 60% 40% at 50% 18%,rgba(0,86,140,.28),transparent 70%),linear-gradient(rgba(0,212,255,.045) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(0,212,255,.045) 1px,transparent 1px) 0 0/44px 44px;
-webkit-mask:radial-gradient(ellipse at 50% 30%,#000 15%,transparent 75%);mask:radial-gradient(ellipse at 50% 30%,#000 15%,transparent 75%)}
body.lit::before{opacity:1}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 0;z-index:1}
.brand{font-weight:600;letter-spacing:.42em;font-size:14px;color:var(--c1);text-shadow:0 0 14px rgba(0,212,255,.7)}
.status{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--mut)}
.status b{width:7px;height:7px;border-radius:50%;background:var(--c2);box-shadow:0 0 10px var(--c2);transition:.4s}
body[data-s=listening] .status b{background:#7dffb2;box-shadow:0 0 12px #7dffb2}
body[data-s=thinking] .status b{background:var(--c1);animation:blink .7s infinite}
body[data-s=speaking] .status b{background:#fff;box-shadow:0 0 12px var(--c1)}
@keyframes blink{50%{opacity:.2}}
#orb{width:100%;height:230px;display:block;z-index:1;touch-action:none;cursor:grab;user-select:none}
#orb:active{cursor:grabbing}

#log{overflow-y:auto;padding:14px 4px 10px;display:flex;flex-direction:column;gap:16px;z-index:1;scroll-behavior:smooth;
-webkit-mask:linear-gradient(transparent,#000 22px);mask:linear-gradient(transparent,#000 22px);scrollbar-width:thin;scrollbar-color:var(--c3) transparent}
.msg{max-width:88%;line-height:1.65;font-size:15px;animation:in .7s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(10px);filter:blur(6px)}}
.msg.me{align-self:flex-end;padding:10px 16px;border:1px solid rgba(0,212,255,.35);border-radius:16px 16px 4px 16px;background:rgba(0,51,86,.35);box-shadow:0 0 18px rgba(0,212,255,.1)}
.msg.bot{align-self:flex-start;padding-left:16px;border-left:2px solid var(--c1);box-shadow:-10px 0 18px -12px var(--c1)}
.msg.bot.err{border-color:#ff5d73;color:#ffb3bd;box-shadow:none}
.msg code.i{font-family:Consolas,monospace;font-size:.9em;padding:1px 6px;border-radius:5px;background:rgba(0,212,255,.12);color:var(--c1)}
.msg strong{color:#fff}
.typing{display:inline-flex;gap:5px;padding:6px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--c1);animation:dot 1.1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{transform:scale(.4);opacity:.3}40%{transform:scale(1);opacity:1}}
.cursor::after{content:"";display:inline-block;width:7px;height:1em;margin-left:3px;vertical-align:-2px;background:var(--c1);box-shadow:0 0 8px var(--c1);animation:blink .8s infinite}

/* ventana de código */
.code{margin:12px 0;border:1px solid rgba(0,212,255,.3);border-radius:12px;overflow:hidden;background:#010b12;box-shadow:0 0 24px rgba(0,212,255,.08);animation:in .6s var(--ease) both}
.code .bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(90deg,var(--c3),#001c30);font-size:12px;color:var(--c1)}
.code .bar i{width:9px;height:9px;border-radius:50%;background:var(--c2);opacity:.7}
.code .bar i+i{opacity:.45}.code .bar i+i+i{opacity:.25}
.code .bar span{margin-left:6px;flex:1;font-family:Consolas,monospace}
.code .cp{padding:3px 10px;border:1px solid rgba(0,212,255,.4);border-radius:6px;font-size:12px;transition:.25s}
.code .cp:hover{background:rgba(0,212,255,.15);box-shadow:0 0 12px rgba(0,212,255,.4)}
.code pre{padding:14px 16px;overflow-x:auto;font:13px/1.6 Consolas,"Courier New",monospace;color:#bfeeff;scrollbar-width:thin;scrollbar-color:var(--c3) transparent}

/* entrada */
form{display:flex;align-items:flex-end;gap:10px;padding:8px 8px 8px 18px;border:1px solid rgba(0,212,255,.4);border-radius:26px;background:rgba(0,10,18,.85);z-index:1;transition:box-shadow .4s,border-color .4s}
form:focus-within{border-color:var(--c1);box-shadow:0 0 26px rgba(0,212,255,.28),inset 0 0 14px rgba(0,212,255,.06)}
textarea{flex:1;resize:none;max-height:140px;padding:9px 0;background:none;border:0;outline:0;color:var(--txt);font:inherit;font-size:15px;line-height:1.5}
textarea::placeholder{color:var(--mut)}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(0,212,255,.45);transition:.3s var(--ease);flex:none}
.ib:hover{background:rgba(0,212,255,.15);box-shadow:0 0 16px rgba(0,212,255,.45)}
.ib svg{width:19px;height:19px;stroke:var(--c1);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#mic.on{background:var(--c1);box-shadow:0 0 0 0 rgba(0,212,255,.6);animation:pulse 1.6s infinite}
#mic.on svg{stroke:#001a2b}
@keyframes pulse{to{box-shadow:0 0 0 16px rgba(0,212,255,0)}}
#send:disabled{opacity:.35;pointer-events:none}
@media(max-width:560px){#app{grid-template-rows:auto 170px 1fr auto;padding:0 12px 12px}#orb{height:170px}.msg{max-width:96%}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body data-s="idle">

<div id="boot" role="button" tabindex="0" aria-label="Toca varias veces para iniciar Sellium">
  <div id="bz"><div class="rings"></div><div class="hint"><div class="core"></div><div class="dots" id="dots"></div><span>TOCA PARA DESPERTAR</span></div></div>
  <div id="bload"><div class="lc"></div><span>INICIALIZANDO</span><div class="pb"><i></i></div></div>
</div>
<div id="flash"></div>

<main id="app">
  <header>
    <div class="brand">SELLIUM</div>
    <div class="status"><b></b><span id="stxt">En espera</span></div>
  </header>
  <canvas id="orb"></canvas>
  <section id="log" aria-live="polite"></section>
  <form id="form" autocomplete="off">
    <textarea id="inp" rows="1" placeholder="Escribe o activa el micrófono…"></textarea>
    <button type="button" class="ib" id="mic" aria-label="Activar micrófono"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button type="submit" class="ib" id="send" aria-label="Enviar" disabled><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </form>
</main>

<script>
/* =================== CONFIGURACIÓN =================== */
const CFG = {
  API_URL: 'http://localhost:8000/api/chat', // tu endpoint FastAPI (POST, respuesta en streaming)
  STT_URL: 'http://localhost:8000/api/stt',
  TTS_URL: 'http://localhost:8000/api/tts',
  VOICE_ENABLED: true, // Faster-Whisper + Piper locales en el backend
  BOOT_SOUND: 'Assets/Sound/run2.mp3', // sonido de arranque (~7 s). Al terminar se abre el ojo. Vacío = sintético
  BOOT_DURATION: 7000, // ms de respaldo si el audio no carga (la barra y el parpadeo usan la duración real del audio)
  BLINK_SOUND: '',     // sonido extra del parpadeo, ej: 'Assets/Sound/blink.mp3' (vacío = sintético)
  BLINK_VOLUME: .7,
  BLINK_DURATION: 1700, // ms que dura el parpadeo del orbe
  ZOOM_STEP: .18,      // cuánto crece el zoom con cada toque
  ZOOM_MAX: 1.9,       // tope del zoom acumulado antes del último toque
  ZOOM_FINAL: 6.5,     // zoom al que llega con el último toque
  TAP_SOUND: 'Assets/Sound/golpe.mp3',       // sonido de cada toque al iniciar, ej: 'Assets/Sound/tap.mp3' (vacío = blip sintético)
  TAP_VOLUME: .6,      // volumen del toque (0 a 1)
  TAP_RISE: true,      // cada toque suena un poco más agudo que el anterior
  TAPS: 5,             // pulsaciones necesarias para encender
  WAKE_DELAY: 1500,    // ms entre la última pulsación y el encendido
  LANG: 'es-CO',       // idioma del reconocimiento de voz
  DEMO_ON_ERROR: true  // si la API no responde, simula una respuesta para probar la interfaz
};
const C1 = [0,212,255], C2 = [0,169,210], C3 = [0,51,86];
const $ = id => document.getElementById(id);
const body = document.body, log = $('log'), inp = $('inp'), send = $('send'), micBtn = $('mic');
const LABELS = {idle:'En espera', listening:'Escuchando', thinking:'Pensando', speaking:'Respondiendo'};
const history = [];
function setState(s){ body.dataset.s = s; $('stxt').textContent = LABELS[s]; }

/* =================== ARRANQUE =================== */
let actx;
const audio = () => actx || (actx = new (window.AudioContext || window.webkitAudioContext)());
const boot = $('boot'), dots = $('dots');
for (let i = 0; i < CFG.TAPS; i++) dots.appendChild(document.createElement('i'));
let taps = 0, awake = false;
let revealed = false, blinkT0 = null, eye = 0, eyeLine = 0;

/* zoom del arranque: cada toque acerca y el zoom retrocede muy despacio; el último toque lo agranda del todo */
const bz = $('bz');
let z = 1, zd = 1, zoomFinal = false, zt = performance.now();
function zoomStep(){ z = Math.min(CFG.ZOOM_MAX, z + CFG.ZOOM_STEP); }
function zoomLoop(now){
  if (revealed) return;
  const dt = Math.min(50, now - zt); zt = now;
  if (zoomFinal) z += (CFG.ZOOM_FINAL - z) * Math.min(1, dt*.0028);
  else z = Math.max(1, z - dt*.000035);                 // retroceso lento (~0.035 por segundo)
  zd += (z - zd) * Math.min(1, dt*.012);                // suaviza el salto de cada toque
  bz.style.transform = `scale(${zd.toFixed(4)})`;
  requestAnimationFrame(zoomLoop);
}
requestAnimationFrame(zoomLoop);

function ripple(x, y){
  const r = document.createElement('div');
  r.className = 'rip'; r.style.left = x + 'px'; r.style.top = y + 'px';
  document.body.appendChild(r); r.addEventListener('animationend', () => r.remove());
}
let pgo = false;
function startProgress(d){
  if (pgo) return; pgo = true;
  const b = $('bload'); b.style.setProperty('--pd', d + 's'); b.classList.add('go');
}
function bootSound(done){
  let fired = false; const fin = () => { if (!fired){ fired = true; done(); } };
  if (CFG.BOOT_SOUND){
    const s = new Audio(CFG.BOOT_SOUND), fb = CFG.BOOT_DURATION/1000;
    const fail = () => { startProgress(fb); setTimeout(fin, CFG.BOOT_DURATION); };
    s.addEventListener('playing', () => startProgress(isFinite(s.duration) ? s.duration : fb));
    s.addEventListener('ended', fin);
    s.addEventListener('error', fail);
    s.play().catch(fail);
    setTimeout(fin, CFG.BOOT_DURATION + 4000);   // seguro por si el audio nunca termina
    return;
  }
  startProgress(2); setTimeout(fin, 2000);
  const a = audio(), t = a.currentTime, g = a.createGain();
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.18, t + .25); g.gain.exponentialRampToValueAtTime(.001, t + 1.8);
  g.connect(a.destination);
  [[110,440],[165,660]].forEach(([f0,f1]) => {
    const o = a.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + 1.2);
    o.connect(g); o.start(t); o.stop(t + 1.9);
  });
}
function tapSound(n){
  const k = CFG.TAP_RISE ? n : 0;
  if (CFG.TAP_SOUND){
    const s = new Audio(CFG.TAP_SOUND); s.volume = CFG.TAP_VOLUME;
    s.preservesPitch = false; s.playbackRate = 1 + k*.07;
    s.play().catch(()=>{}); return;
  }
  const a = audio(), t = a.currentTime, o = a.createOscillator(), g = a.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(420*(1 + k*.16), t);
  o.frequency.exponentialRampToValueAtTime(260*(1 + k*.16), t + .14);
  g.gain.setValueAtTime(CFG.TAP_VOLUME*.3, t); g.gain.exponentialRampToValueAtTime(.001, t + .18);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + .2);
}
function tap(e){
  if (awake) return;
  const p = e.touches ? e.touches[0] : e;
  const x = p.clientX ?? innerWidth/2, y = p.clientY ?? innerHeight/2;
  ripple(x, y); audio().resume(); tapSound(taps); zoomStep();
  dots.children[taps]?.classList.add('on'); taps++;
  clearTimeout(tap.t);
  if (taps >= CFG.TAPS){
    awake = true; zoomFinal = true; boot.classList.add('waking');
    setTimeout(wake, CFG.WAKE_DELAY);
  } else {
    // si se deja de pulsar, la cuenta se reinicia suavemente
    tap.t = setTimeout(() => { taps = 0; [...dots.children].forEach(d => d.classList.remove('on')); }, 3500);
  }
}
function playBlink(){
  if (CFG.BLINK_SOUND){ const s = new Audio(CFG.BLINK_SOUND); s.volume = CFG.BLINK_VOLUME; s.play().catch(()=>{}); return; }
  const a = audio(), t = a.currentTime, g = a.createGain(), f = a.createBiquadFilter(), o = a.createOscillator();
  f.type = 'bandpass'; f.Q.value = 1.2;
  f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(3200, t + .5);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(CFG.BLINK_VOLUME*.5, t + .12); g.gain.exponentialRampToValueAtTime(.001, t + .9);
  o.type = 'sawtooth'; o.frequency.value = 110;
  o.connect(f); f.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 1);
  const p = a.createOscillator(), pg = a.createGain();   // "ping" cuando el ojo termina de abrir
  p.type = 'sine'; p.frequency.value = 1320;
  pg.gain.setValueAtTime(0, t + .75); pg.gain.linearRampToValueAtTime(CFG.BLINK_VOLUME*.2, t + .77); pg.gain.exponentialRampToValueAtTime(.001, t + 1.6);
  p.connect(pg); pg.connect(a.destination); p.start(t + .75); p.stop(t + 1.7);
}
function wake(){
  boot.classList.add('loading');   // pantalla de carga mientras suena el audio de arranque
  bootSound(reveal);               // al terminar el audio -> reveal()
}
function reveal(){
  revealed = true;
  $('flash').classList.add('go');
  setTimeout(() => { boot.classList.add('gone'); body.classList.add('lit'); $('app').classList.add('on'); }, 250);
  setTimeout(() => { blinkT0 = performance.now(); playBlink(); }, 400);                 // parpadeo + sonido
  setTimeout(() => { $('app').classList.add('ui'); greet(); }, 400 + CFG.BLINK_DURATION*.7); // el chat aparece tras abrir el ojo
}
boot.addEventListener('pointerdown', tap);
boot.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') tap({clientX: innerWidth/2, clientY: innerHeight/2}); });

/* =================== ORBE / VISUALIZADOR =================== */
const cv = $('orb'), g2 = cv.getContext('2d');
let W, H, DPR;
function fit(){ DPR = Math.min(devicePixelRatio || 1, 2); W = cv.clientWidth; H = cv.clientHeight; cv.width = W*DPR; cv.height = H*DPR; g2.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize', fit); fit();

let an = null, fd, td, stream = null;
let lvl = 0, cen = .4, rot = 0, spin = 0, spk = false;
const mix = (a,b,k) => a.map((v,i) => Math.round(v + (b[i]-v)*k));
const rgb = (c,a=1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const N = 96;

/* --- parpadeo: nada -> línea de luz -> ojo medio abierto -> cierra -> abre del todo --- */
const KF = [[0,0],[.28,.5],[.42,.04],[.8,1],[1,1]];
function eyeUpdate(){
  if (blinkT0 === null){ eye = 0; eyeLine = 0; return; }
  const p = (performance.now() - blinkT0)/CFG.BLINK_DURATION;
  if (p >= 1){ eye = 1; eyeLine = 0; return; }
  let i = 1; while (KF[i][0] < p) i++;
  const [p0,v0] = KF[i-1], [p1,v1] = KF[i], k = (p - p0)/(p1 - p0), e = k*k*(3 - 2*k);
  eye = v0 + (v1 - v0)*e; eyeLine = Math.min(1, p*10);
}
function eyeLineDraw(){
  const a = eyeLine*Math.pow(1 - eye, .6); if (a < .01) return;
  const cx = W/2, cy = H/2, w = Math.min(W*.4, 260)*(.35 + (1 - eye)*.65);
  const gr = g2.createLinearGradient(cx - w, 0, cx + w, 0);
  gr.addColorStop(0, rgb(C1,0)); gr.addColorStop(.5, rgb(C1,a)); gr.addColorStop(1, rgb(C1,0));
  g2.save(); g2.strokeStyle = gr; g2.lineWidth = 2; g2.shadowBlur = 18; g2.shadowColor = rgb(C1);
  g2.beginPath(); g2.moveTo(cx - w, cy); g2.lineTo(cx + w, cy); g2.stroke(); g2.restore();
}

/* --- interacción con el orbe: clic = crece (acumulable), mantener = se deforma hacia el cursor --- */
let boost = 0, pressed = false, px = 0, py = 0, ox = 0, oy = 0, vx = 0, vy = 0;
const ripples = [];
function physics(){
  const R0 = Math.min(H*.24, 54);
  let tx = 0, ty = 0;
  if (pressed){
    boost = Math.min(1, boost + .006);                       // mantener presionado sigue ampliando
    const dx = px - W/2, dy = py - H/2, d = Math.hypot(dx,dy) || 1, m = Math.min(d*.45, R0*.9);
    tx = dx/d*m; ty = dy/d*m;                                // objetivo: hacia el cursor
  } else boost = Math.max(0, boost - .0015);                 // al soltar, se encoge despacio
  vx += (tx - ox)*.14; vy += (ty - oy)*.14; vx *= .8; vy *= .8; ox += vx; oy += vy; // resorte con rebote
}
function drawRipples(){
  const now = performance.now();
  for (let i = ripples.length - 1; i >= 0; i--){
    const a = (now - ripples[i].t)/1000;
    if (a > 1){ ripples.splice(i,1); continue; }
    g2.strokeStyle = rgb(C1,(1 - a)*.7); g2.lineWidth = 1.5;
    g2.beginPath(); g2.arc(ripples[i].x, ripples[i].y, 6 + a*70, 0, 7); g2.stroke();
  }
}
function ptr(e){ const r = cv.getBoundingClientRect(); px = e.clientX - r.left; py = e.clientY - r.top; }
cv.addEventListener('pointerdown', e => {
  ptr(e); pressed = true; cv.setPointerCapture(e.pointerId);
  boost = Math.min(1, boost + .2);                            // cada toque amplía un paso
  vx += (px - W/2)*.03; vy += (py - H/2)*.03;                 // pequeño empujón
  ripples.push({x: px, y: py, t: performance.now()});
});
cv.addEventListener('pointermove', e => { if (pressed) ptr(e); });
['pointerup','pointercancel'].forEach(n => cv.addEventListener(n, () => pressed = false));

function analyse(t){
  let target = 0, hz = cen;
  if (an){
    an.getByteTimeDomainData(td); an.getByteFrequencyData(fd);
    let s = 0; for (let i = 0; i < td.length; i++){ const v = (td[i]-128)/128; s += v*v; }
    const db = 20*Math.log10(Math.sqrt(s/td.length) || 1e-5);       // intensidad en dB
    target = Math.min(1, Math.max(0, (db + 55) / 45));
    let num = 0, den = 0; for (let i = 2; i < 180; i++){ num += i*fd[i]; den += fd[i]; }
    if (den > 600) hz = Math.min(1, (num/den) / 70);                  // centroide espectral ≈ tono
  } else if (spk){
    target = .25 + .22*Math.abs(Math.sin(t/190)) * (.6 + .4*Math.sin(t/530));
  }
  lvl += (target - lvl) * (target > lvl ? .35 : .08);
  cen += (hz - cen) * .08;
}
function draw(t){
  requestAnimationFrame(draw);
  analyse(t);
  const R0 = Math.min(H*.24, 54);
  physics();
  const R = R0*(1 + boost*.18);
  const cx = W/2 + ox*.45, cy = H/2 + oy*.45;     // anillos y barras siguen a medias
  const kx = W/2 + ox, ky = H/2 + oy;             // el núcleo sigue del todo
  const st = Math.hypot(ox,oy)/R0, dir = Math.atan2(oy,ox);
  const think = body.dataset.s === 'thinking';
  spin += think ? .045 : .004 + lvl*.02; rot += .0015 + lvl*.01;
  const col = mix(mix(C2, C1, cen), [255,255,255], Math.min(.5, lvl*.55)); // tono → color, volumen → brillo
  eyeUpdate();
  g2.clearRect(0,0,W,H);
  g2.save(); g2.translate(W/2, H/2); g2.scale(1, Math.max(eye, .001)); g2.translate(-W/2, -H/2);
  g2.globalAlpha = Math.min(1, eye*2.2);
  g2.globalCompositeOperation = 'lighter';

  // halo
  const rr = R*(1.9 + lvl*.9);
  let gr = g2.createRadialGradient(cx,cy,R*.4,cx,cy,rr);
  gr.addColorStop(0, rgb(col,.18+lvl*.25)); gr.addColorStop(.55, rgb(C3,.35)); gr.addColorStop(1, rgb(C3,0));
  g2.fillStyle = gr; g2.beginPath(); g2.arc(cx,cy,rr,0,7); g2.fill();

  // barras de frecuencia
  g2.lineCap = 'round'; g2.lineWidth = 2.4; g2.shadowBlur = 12; g2.shadowColor = rgb(col);
  const bins = fd ? Math.floor(fd.length*.45) : 0;
  for (let k = 0; k < N; k++){
    const m = Math.abs(k - N/2) / (N/2);                              // espejo simétrico
    let v;
    if (an) v = Math.pow(fd[Math.floor(m*bins)+1]/255, 1.6);
    else v = .06 + .05*Math.sin(t/700 + k*.45) + (spk ? lvl*.8*Math.abs(Math.sin(k*.9 + t/110)) : 0);
    const a = k/N*Math.PI*2 + rot, len = (4 + boost*6 + v*(R*.6)) * (1 + 1.6*st*Math.max(0, Math.cos(a - dir)));
    g2.strokeStyle = rgb(col, .35 + v*.65);
    g2.beginPath();
    g2.moveTo(cx + Math.cos(a)*(R+6), cy + Math.sin(a)*(R+6));
    g2.lineTo(cx + Math.cos(a)*(R+6+len), cy + Math.sin(a)*(R+6+len));
    g2.stroke();
  }
  g2.shadowBlur = 0;

  // anillos
  g2.lineWidth = 1.2; g2.strokeStyle = rgb(C2,.55);
  g2.beginPath(); g2.arc(cx,cy,R,0,7); g2.stroke();
  g2.setLineDash([3,9]); g2.strokeStyle = rgb(C1,.4);
  g2.beginPath(); g2.arc(cx,cy,R*1.28 + lvl*10,spin,spin+6.283); g2.stroke(); g2.setLineDash([]);
  if (think){
    g2.lineWidth = 2.5; g2.strokeStyle = rgb(C1,.95); g2.shadowBlur = 14; g2.shadowColor = rgb(C1);
    g2.beginPath(); g2.arc(cx,cy,R*.78,spin*2,spin*2+1.7); g2.stroke(); g2.shadowBlur = 0;
  }
  // núcleo
  const cr = R*(.52 + lvl*.28 + .03*Math.sin(t/500));
  g2.save(); g2.translate(kx,ky); g2.rotate(dir); g2.scale(1 + st*.7, 1/(1 + st*.2));
  gr = g2.createRadialGradient(0,0,0,0,0,cr);
  gr.addColorStop(0, rgb(mix(col,[255,255,255],.55),.95)); gr.addColorStop(.45, rgb(col,.55)); gr.addColorStop(1, rgb(C3,0));
  g2.fillStyle = gr; g2.beginPath(); g2.arc(0,0,cr,0,7); g2.fill(); g2.restore(); drawRipples();
  g2.globalCompositeOperation = 'source-over';
  g2.restore(); eyeLineDraw();
}
requestAnimationFrame(draw);

/* =================== MICRÓFONO + VOZ A TEXTO LOCAL =================== */
let micOn = false, recorder = null, audioChunks = [], transcribeOnStop = false, ttsAudio = null;

async function startMic(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}});
  }catch(e){ return notice('No pude acceder al micrófono. Revisa los permisos del navegador.'); }
  const a = audio(); await a.resume();
  an = a.createAnalyser(); an.fftSize = 1024; an.smoothingTimeConstant = .78;
  a.createMediaStreamSource(stream).connect(an);
  fd = new Uint8Array(an.frequencyBinCount); td = new Uint8Array(an.fftSize);
  micOn = true; micBtn.classList.add('on'); setState('listening');
  if (!window.MediaRecorder) return notice('Este navegador no permite grabar audio localmente. Usa Chrome o Edge actualizado.');
  const type = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : '';
  recorder = type ? new MediaRecorder(stream, {mimeType:type}) : new MediaRecorder(stream);
  audioChunks = [];
  recorder.ondataavailable = e => { if (e.data.size) audioChunks.push(e.data); };
  recorder.onstop = async () => {
    const blob = new Blob(audioChunks, {type:recorder?.mimeType || 'audio/webm'});
    recorder = null;
    if (transcribeOnStop && blob.size) await transcribeAudio(blob);
  };
  recorder.start();
}
function stopMic(transcribeResult = true){
  micOn = false; micBtn.classList.remove('on');
  transcribeOnStop = transcribeResult;
  recorder?.state !== 'inactive' && recorder?.stop();
  stream && stream.getTracks().forEach(t => t.stop());
  stream = an = null; fd = td = null;
  if (body.dataset.s === 'listening') setState('idle');
}
micBtn.onclick = () => micOn ? stopMic() : startMic();

async function transcribeAudio(blob){
  try{
    setState('thinking');
    const form = new FormData(); form.append('file', blob, 'microfono.webm');
    const res = await fetch(CFG.STT_URL, {method:'POST', body:form});
    const data = await res.json(); if (!res.ok) throw new Error(data.detail || 'No se pudo transcribir el audio.');
    inp.value = (data.text || '').trim(); autosize();
    if (inp.value) await submit(); else notice('No detecté voz. Intenta hablar más cerca del micrófono.');
  }catch(err){ notice('Error de voz local: ' + err.message); }
  finally{ if (!busy) setState('idle'); }
}

async function speak(text){
  if (!CFG.VOICE_ENABLED || !text.trim()) return;
  try{
    ttsAudio?.pause();
    const res = await fetch(CFG.TTS_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text})});
    if (!res.ok){ const data = await res.json().catch(()=>({})); throw new Error(data.detail || 'No se pudo sintetizar la voz.'); }
    const url = URL.createObjectURL(await res.blob());
    ttsAudio = new Audio(url); ttsAudio.onended = () => URL.revokeObjectURL(url);
    await ttsAudio.play();
  }catch(err){ console.warn('TTS local:', err.message); }
}

/* =================== CHAT =================== */
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const inline = s => esc(s).replace(/`([^`\n]+)`/g,'<code class="i">$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
function render(text){
  let out = '', i = 0;
  for(;;){
    const s = text.indexOf('```', i);
    if (s < 0){ out += inline(text.slice(i)); break; }
    out += inline(text.slice(i, s));
    const nl = text.indexOf('\n', s); if (nl < 0) break;
    const lang = text.slice(s+3, nl).trim() || 'código';
    const e = text.indexOf('```', nl+1);
    const code = text.slice(nl+1, e < 0 ? undefined : e);
    out += `<div class="code"><div class="bar"><i></i><i></i><i></i><span>${esc(lang)}</span><button type="button" class="cp">Copiar</button></div><pre><code>${esc(code)}</code></pre></div>`;
    if (e < 0) break; i = e + 3;
  }
  return out;
}
log.addEventListener('click', e => {
  const b = e.target.closest('.cp'); if (!b) return;
  navigator.clipboard.writeText(b.closest('.code').querySelector('code').textContent).then(() => {
    b.textContent = 'Copiado'; setTimeout(() => b.textContent = 'Copiar', 1600);
  });
});
function add(cls, html){
  const d = document.createElement('div'); d.className = 'msg ' + cls; d.innerHTML = html;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
const notice = t => add('bot err', esc(t));
function greet(){ add('bot', 'Sistemas en línea. ¿En qué te ayudo?'); }

async function* streamReply(msg){
  const res = await fetch(CFG.API_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message: msg, history})});
  if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);
  const sse = (res.headers.get('content-type') || '').includes('event-stream');
  const rd = res.body.getReader(), dec = new TextDecoder(); let buf = '';
  for(;;){
    const {done, value} = await rd.read(); if (done) break;
    const chunk = dec.decode(value, {stream:true});
    if (!sse){ yield chunk; continue; }
    buf += chunk; const lines = buf.split('\n'); buf = lines.pop();
    for (const l of lines) if (l.startsWith('data:')){ const p = l.slice(5).replace(/^ /,''); if (p === '[DONE]') return; yield p.replace(/\\n/g,'\n'); }
  }
}
async function* demoReply(){
  const t = 'Modo demo: no encontré tu API en `' + CFG.API_URL + '`. Así se ve una respuesta con código:\n\n```python\nfrom fastapi import FastAPI\nfrom fastapi.responses import StreamingResponse\n\napp = FastAPI()\n\n@app.post("/api/chat")\nasync def chat(body: dict):\n    async def gen():\n        yield "Hola desde **Ollama**"\n    return StreamingResponse(gen(), media_type="text/plain")\n```\n\nCuando conectes el backend, esto desaparece.';
  for (let i = 0; i < t.length; i += 3){ await new Promise(r => setTimeout(r, 22)); yield t.slice(i, i+3); }
}

let busy = false;
async function submit(){
  const msg = inp.value.trim(); if (!msg || busy) return;
  busy = true; inp.value = ''; autosize(); send.disabled = true;
  add('me', esc(msg)).style.whiteSpace = 'pre-wrap';
  history.push({role:'user', content: msg});
  const bot = add('bot', '<span class="typing"><i></i><i></i><i></i></span>');
  if (!micOn) setState('thinking');
  let full = '', first = true;
  const run = async src => {
    for await (const ch of src){
      if (first){ first = false; spk = true; if (!micOn) setState('speaking'); bot.classList.add('cursor'); }
      full += ch; bot.innerHTML = render(full); log.scrollTop = log.scrollHeight;
    }
  };
  try{ await run(streamReply(msg)); }
  catch(err){
    if (CFG.DEMO_ON_ERROR && first){ try{ await run(demoReply()); }catch{} }
    else { bot.classList.add('err'); bot.innerHTML = 'Error al conectar con el servidor: ' + esc(err.message); }
  }
  bot.classList.remove('cursor'); spk = false; busy = false;
  if (full) history.push({role:'assistant', content: full});
  if (full) void speak(full);
  setState(micOn ? 'listening' : 'idle'); send.disabled = !inp.value.trim();
}
function autosize(){ inp.style.height = 'auto'; inp.style.height = Math.min(inp.scrollHeight, 140) + 'px'; send.disabled = busy || !inp.value.trim(); }
inp.addEventListener('input', autosize);
inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); submit(); } });
$('form').addEventListener('submit', e => { e.preventDefault(); submit(); });
</script>
